name: A-topk5
description: Collapsed tree, top-5 nodes.
stage: A
factor: retrieval
baseline: A-baseline
method: raptor
split: dev
top_k: 5
max_tokens: null
embedding: null
raptor:
  chunking:
    strategy: sentence
    max_tokens: 100
    overlap_tokens: 0
    params: {}
  clustering:
    strategy: raptor_gmm
    reduction_dimension: 10
    threshold: 0.1
    max_cluster_tokens: 3500
    random_state: 224
    params: {}
  builder:
    max_layers: 5
    summarization_length: 100
    min_nodes_to_cluster: null
    max_workers: 4
    embedding_key: EMB
  retrieval:
    mode: collapsed
    top_k: 10
    max_tokens: 3500
    selection_mode: top_k
    threshold: 0.5
    start_layer: null
    num_layers: null
    hybrid: false
    rrf_k: 60
    reranker: null
    mmr_lambda: null
    candidates: 50
  models:
    provider: gemini
    embedding_model: gemini-embedding-001
    llm_model: gemini-3.5-flash-lite
    embedding_provider: null
    use_task_types: true
    cache: true
