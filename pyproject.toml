[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "raptor-code"
version = "0.2.0"
description = "RAPTOR: recursive abstractive tree-organized retrieval, with Gemini/local models, an experiment harness, and codebase support."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [{ name = "Raptor-code contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "umap-learn>=0.5.7",
  "tiktoken>=0.7",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "tenacity>=8.2",
  "typer>=0.12",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
local = ["sentence-transformers>=3.0", "torch>=2.1"]
ollama = ["httpx>=0.27"]
app = ["streamlit>=1.40"]
code = ["tree-sitter>=0.23", "tree-sitter-python>=0.23", "pathspec>=0.12"]
mcp = ["mcp>=1.2"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
]
all = ["raptor-code[gemini,local,ollama,app,code,mcp]"]

[project.scripts]
raptor = "raptor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["raptor"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["quality_repo", ".venv*", "web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"apps/*" = ["E402"]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["raptor"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls real model APIs (needs GEMINI_API_KEY); deselected by default",
  "slow: slower tests (UMAP/numba JIT)",
]
addopts = "-m 'not live'"
filterwarnings = [
  "ignore::DeprecationWarning:umap.*",
  "ignore::UserWarning:umap.*",
  "ignore:.*n_jobs value.*:UserWarning",
]
