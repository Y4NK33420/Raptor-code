name: A-chunk-semantic
description: 'Semantic chunking: cut where neighbouring-sentence similarity drops
  (80th percentile), max 100 tokens. Local bge-small embeddings (vs the A-emb-bge-small
  baseline).'
stage: A
factor: chunking
baseline: A-emb-bge-small
embedding: local:bge-small
raptor:
  chunking:
    strategy: semantic
    max_tokens: 100
